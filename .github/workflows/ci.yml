name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --exclude grift-rules
      - name: Editor example
        working-directory: examples/emacs
        run: cargo clippy --all-targets --locked -- -D warnings

  # The rules grift keeps (RULES.md): every obligation, the rules harness and the laws, beside
  # `check` so CI takes no longer. F4 runs the `grift` runner built beside the test. The rows that
  # time a stop or compare timings run after the rest, one at a time, so other tests can't slow them.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p grift-cli --locked
      - run: cargo test -p grift-rules --locked -- --skip witnesses::r1 --skip witnesses::f1 --skip witnesses::f2 --skip witnesses::f3
      # Today's core doesn't keep these four yet (RULES.md), so they are ignored and this step only
      # reports them. Drop `continue-on-error` once each one passes and loses its `ignore`.
      - run: cargo test -p grift-rules --locked -- --include-ignored --test-threads=1 --exact witnesses::r1 witnesses::f1 witnesses::f2 witnesses::f3
        continue-on-error: true

  # The library on the wasm target with the least of an operating system: a target with more, such
  # as wasm32-wasip1, needs nothing this one doesn't.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p grift --locked --target wasm32-unknown-unknown

  # The rust-version Cargo.toml declares, read from there, so the declaration can't go false.
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: declared
        run: sed -n 's/^rust-version = "\(.*\)"$/version=\1/p' Cargo.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.declared.outputs.version }}
      - run: cargo build --workspace --locked
