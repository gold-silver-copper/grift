[package]
name = "grift-docs"
version = "0.1.0"
edition = "2021"
description = "Static analysis documentation generator for the grift Lisp interpreter"

[dependencies]
syn      = { version = "2", features = ["full", "extra-traits", "visit"] }
quote    = "1"
proc-macro2 = "1"
walkdir  = "2"
clap     = { version = "4", features = ["derive"] }
anyhow   = "1"
indexmap  = "2"
