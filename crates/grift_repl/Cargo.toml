[package]
name = "grift_repl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REPL for the Grift Scheme language"
repository = "https://github.com/gold-silver-copper/grift"
documentation = "https://docs.rs/grift_repl"
keywords = ["repl", "lisp", "scheme", "interpreter"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "grift"
path = "src/main.rs"

[[bin]]
name = "grift-bench"
path = "src/bench.rs"

[dependencies]
grift_arena = { version = "1.3.0", path = "../grift_arena" }
grift_parser = { version = "1.3.0", path = "../grift_parser" }
grift_eval = { version = "1.3.0", path = "../grift_eval" }
grift_arena_embedded = { version = "1.3.0", path = "../grift_arena_embedded" }
grift_std = { version = "1.3.0", path = "../grift_std" }
rustyline = { version = "17.0.2", features = ["derive"] }
