[package]
name = "grift_repl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REPL for the grift Lisp language"

[[bin]]
name = "grift"
path = "src/main.rs"

[[bin]]
name = "grift-bench"
path = "src/bench.rs"

[dependencies]
pwn_arena = { path = "../pwn_arena" }
grift_parser = { path = "../grift_parser" }
grift_eval = { path = "../grift_eval" }
pwn_arena_embedded = { path = "../pwn_arena_embedded" }
