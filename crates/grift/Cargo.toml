[package]
name = "grift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A tiny Kernel-style Lisp built on fexprs, for embedding in Rust"

# Check and format the same host compiled unoptimized by tests/stack.rs.
[[test]]
name = "host"
path = "tests/host/main.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
