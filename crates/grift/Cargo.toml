[package]
name = "grift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A tiny Kernel-style Lisp built on fexprs, for embedding in Rust"
repository = "https://github.com/gold-silver-copper/grift"
readme = "README.md"
keywords = ["lisp", "fexpr", "kernel", "embedded", "interpreter"]
categories = ["compilers"]

[[example]]
name = "stops"
path = "../../examples/stops.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
