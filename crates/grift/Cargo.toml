[package]
name = "grift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A minimal no_std Scheme implementation with arena-based garbage collection"
readme = "README.md"
keywords = ["scheme", "lisp", "no_std", "embedded", "interpreter"]
categories = ["no-std", "embedded", "development-tools"]
repository = "https://github.com/gold-silver-copper/grift"
documentation = "https://docs.rs/grift"

[lib]
name = "grift"
path = "src/lib.rs"

[[bin]]
name = "grift"
path = "src/main.rs"
required-features = ["std"]
doc-scrape-examples = false

[[bin]]
name = "scheme-test-runner"
path = "src/bin/scheme-test-runner.rs"
required-features = ["std"]
doc-scrape-examples = false

[features]
default = ["all-libraries", "alloc"]
std = ["dep:grift_repl", "dep:grift_std"]
alloc = ["grift_eval/alloc"]
all-libraries = ["grift_core/all-libraries"]
scheme-base = ["grift_core/scheme-base"]
scheme-case-lambda = ["grift_core/scheme-case-lambda"]
scheme-char = ["grift_core/scheme-char"]
scheme-cxr = ["grift_core/scheme-cxr"]
scheme-eval = ["grift_core/scheme-eval"]
scheme-file = ["grift_core/scheme-file"]
scheme-inexact = ["grift_core/scheme-inexact"]
scheme-lazy = ["grift_core/scheme-lazy"]
scheme-load = ["grift_core/scheme-load"]
scheme-process-context = ["grift_core/scheme-process-context"]
scheme-read = ["grift_core/scheme-read"]
scheme-repl = ["grift_core/scheme-repl"]
scheme-time = ["grift_core/scheme-time"]
scheme-write = ["grift_core/scheme-write"]

[dependencies]
grift_arena = { workspace = true }
grift_core = { workspace = true }
grift_parser = { workspace = true }
grift_eval = { workspace = true }
grift_repl = { workspace = true, optional = true }
grift_std = { workspace = true, optional = true }

[dev-dependencies]
grift_std = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "minimal"
doc-scrape-examples = false
