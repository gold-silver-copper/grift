[package]
name = "grift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A minimal no_std Scheme implementation with arena-based garbage collection"
readme = "README.md"
keywords = ["scheme", "lisp", "no_std", "embedded", "interpreter"]
categories = ["no-std", "embedded", "development-tools"]
repository = "https://github.com/gold-silver-copper/grift"
documentation = "https://docs.rs/grift"

[lib]
name = "grift"
path = "src/lib.rs"

[[bin]]
name = "grift"
path = "src/main.rs"
required-features = ["std"]

[[example]]
name = "vec_storage_demo"
path = "examples/vec_storage_demo.rs"
required-features = ["std"]

[features]
default = []
std = ["dep:grift_repl", "grift_arena/std"]

[dependencies]
grift_arena = { version = "0.1.1", path = "../grift_arena" }
grift_parser = { version = "0.1.1", path = "../grift_parser" }
grift_eval = { version = "0.1.1", path = "../grift_eval" }
grift_repl = { version = "0.1.1", path = "../grift_repl", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
